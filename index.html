<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE // ALPHA_003</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #050505; color: #bdbdbd; font-family: monospace; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .terminal { width: min(680px, 100%); border: 1px solid #252525; padding: 34px 28px; background: #080808; box-shadow: 0 0 40px rgba(0,0,0,.8); }
  .top { color: #666; font-size: 12px; letter-spacing: 2px; margin-bottom: 34px; }
  h1 { margin: 0 0 8px; font-size: clamp(22px, 5vw, 34px); font-weight: 400; color: #ddd; letter-spacing: 3px; }
  .sub { color: #555; font-size: 12px; margin-bottom: 34px; }
  .line { border-top: 1px solid #1d1d1d; margin: 20px 0; }
  .label { color: #666; font-size: 11px; letter-spacing: 1px; }
  .value { color: #999; margin-top: 5px; }
  audio { width: 100%; margin-top: 24px; filter: grayscale(1); }
  .warning { margin-top: 24px; color: #4d4d4d; font-size: 11px; line-height: 1.7; }
  .footer { margin-top: 30px; color: #303030; font-size: 10px; text-align: right; }
</style>
</head>
<body>
  <main class="terminal">
    <div class="top">NSMP // RECOVERED ARCHIVE</div>
    <h1>ALPHA_003</h1>
    <div class="sub">REC_0007 // AUDIO RECOVERY</div>

    <div class="line"></div>

    <div class="label">STATUS</div>
    <div class="value">DAMAGED</div>

    <br>

    <div class="label">SOURCE</div>
    <div class="value">UNKNOWN</div>

    <br>

    <div class="label">INTEGRITY</div>
    <div class="value">63%</div>

    <audio controls preload="metadata">
      <source src="REC_0007.m4a" type="audio/mp4">
      Seu navegador não suporta reprodução de áudio.
    </audio>

    <div class="warning">
      // WARNING: recovered data may contain corrupted or incomplete material.<br>
      // Do not distribute without authorization.
    </div>

    <div class="footer">FILE ACCESS // GRANTED</div>
  </main>
</body>
</html>
